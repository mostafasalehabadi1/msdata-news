name: release-news
# Drip publishing, fully on GitHub. GitHub's own */5 schedule proved unreliable (it never fired), so one run
# stays alive ~5h50m and releases a few queued news about every 5 minutes, publishing each batch itself;
# before it ends it starts the next run (workflow_dispatch with GITHUB_TOKEN is allowed to trigger workflows).
# Every step has a timeout (1405-07-25: a run published nothing for 8 hours, stuck in one step).
# The hourly schedule is only a safety net to restart the chain; concurrency keeps a single live run.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:  # editing this file (from the manager VPS) also (re)starts the chain
    branches: [main]
    paths: [".github/workflows/release.yml"]
concurrency:
  group: release-news-v3  # 1405-07-25: renamed so a fresh run starts beside a run stuck in the old group
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: release a few queued news every ~5 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name msdata-news-bot
          git config user.email bot@msdata.ir
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            # a failed rebase left the checkout mid-rebase and every later commit failed (1405-07-25: nothing released for hours)
            timeout 180 git pull -q --rebase || { git rebase --abort 2>/dev/null; git fetch -q origin main && git reset -q --hard origin/main; }
            # data fetch lives here too: GitHub's own schedule for fetch.yml silently skipped whole days
            h=$(TZ=Asia/Tehran date +%-H)
            if [ ! -f "/tmp/fetched-$h" ]; then
              touch "/tmp/fetched-$h"
              if timeout 600 python tools/fetch.py; then
                git add -A data
                if ! git diff --cached --quiet; then
                  git commit -qm "data: $(python -c 'import json;print(json.load(open("data/latest.json"))["date_fa"])')"
                  timeout 180 git pull -q --rebase && timeout 180 git push -q origin HEAD:main
                fi
              fi
            fi
            # writer is never started by anything else: if the latest day has unwritten symbols and no writer runs, start one
            left=$(python -c "import json,os;l=json.load(open('data/latest.json'));r={x['symbol'] for x in json.load(open(f\"data/{l['date']}/today.json\"))['rows'] if 'فرعی' not in (x.get('talar') or '')};p=f\"queue/{l['date']}.json\";d={x['symbol'] for x in json.load(open(p))['items']} if os.path.exists(p) else set();print(len(r-d))" 2>/dev/null || echo 0)
            if [ "${left:-0}" -gt 0 ] && [ -z "$(gh run list -R "$GITHUB_REPOSITORY" -w write_free.yml -s in_progress -L 1 -q .[].databaseId --json databaseId)$(gh run list -R "$GITHUB_REPOSITORY" -w write_free.yml -s queued -L 1 -q .[].databaseId --json databaseId)" ]; then
              gh workflow run write_free.yml -R "$GITHUB_REPOSITORY" -f limit=0 && echo "writer started ($left left)"
            fi
            # Kish export-market news (owner 1405-07-15): once an hour, if the latest Kish day has unwritten traded rows, start write_kish
            if [ ! -f "/tmp/kish-$h" ]; then
              touch "/tmp/kish-$h"
              # read-only check (no file written here: data/kish is committed by write_kish only)
              kleft=$(timeout 600 python tools/fetch_kish.py --left 2>/dev/null || echo 0)
              if [ "${kleft:-0}" -gt 0 ] && [ -z "$(gh run list -R "$GITHUB_REPOSITORY" -w write_kish.yml -s in_progress -L 1 -q .[].databaseId --json databaseId)$(gh run list -R "$GITHUB_REPOSITORY" -w write_kish.yml -s queued -L 1 -q .[].databaseId --json databaseId)" ]; then
                gh workflow run write_kish.yml -R "$GITHUB_REPOSITORY" && echo "kish writer started ($kleft left)"
              fi
            fi
            # Iran Energy Exchange news (owner 1405-07-16): same hourly check as Kish
            if [ ! -f "/tmp/energy-$h" ]; then
              touch "/tmp/energy-$h"
              eleft=$(timeout 600 python tools/fetch_energy.py --left 2>/dev/null || echo 0)
              if [ "${eleft:-0}" -gt 0 ] && [ -z "$(gh run list -R "$GITHUB_REPOSITORY" -w write_energy.yml -s in_progress -L 1 -q .[].databaseId --json databaseId)$(gh run list -R "$GITHUB_REPOSITORY" -w write_energy.yml -s queued -L 1 -q .[].databaseId --json databaseId)" ]; then
                gh workflow run write_energy.yml -R "$GITHUB_REPOSITORY" && echo "energy writer started ($eleft left)"
              fi
            fi
            # macro news (اقتصاد کلان): once an hour look for new macro data (macro.yml writes and publishes it)
            if [ ! -f "/tmp/macro-$h" ] && [ -z "$(gh run list -R "$GITHUB_REPOSITORY" -w macro.yml -s in_progress -L 1 -q .[].databaseId --json databaseId)" ]; then
              touch "/tmp/macro-$h"
              timeout 600 python tools/write_macro.py --dry | grep -q "^0 new" || { gh workflow run macro.yml -R "$GITHUB_REPOSITORY" && echo "macro news started"; }
            fi
            # daily report: from 18:30 Tehran on a trading day, until it exists (also after midnight - a day never loses its report) (report.yml writes and publishes it)
            d=$(python -c "import json;print(json.load(open('data/latest.json'))['date'])")
            t=$(TZ=Asia/Tehran date +%F)
            if { [ "$d" \< "$t" ] || { [ "$d" = "$t" ] && [ "$(TZ=Asia/Tehran date +%H%M)" -ge 1830 ]; }; } && { { [ ! -f "queue/report-$d.json" ] && [ ! -f "news/report-$d.json" ]; } || { [ ! -f "queue/kish/report-$d.json" ] && [ ! -f "news/kish/report-$d.json" ]; }; } \
               && [ -z "$(gh run list -R "$GITHUB_REPOSITORY" -w report.yml -s in_progress -L 1 -q .[].databaseId --json databaseId)$(gh run list -R "$GITHUB_REPOSITORY" -w report.yml -s queued -L 1 -q .[].databaseId --json databaseId)" ]; then
              gh workflow run report.yml -R "$GITHUB_REPOSITORY" && echo "daily report started"
            fi
            timeout 600 python tools/release.py
            timeout 600 python tools/news_flow.py || echo "news flow failed"  # owner 1405-07-22: per-hour flow for the stats page
            if timeout 600 python tools/validate.py; then
              git add news stats news-test/edits-skipped.log news-test/edits-applied.log 2>/dev/null || git add news stats  # backend 1405-07-28: edit logs for the content agent
              if ! git diff --cached --quiet; then
                git commit -qm "release: $(date -u +%H:%M)"
                timeout 180 git pull -q --rebase && timeout 180 git push -q origin HEAD:main && timeout 180 git push -qf origin HEAD:refs/heads/published
              fi
            else
              git checkout -q -- news stats; git clean -qfd news  # stats/flow.json too: it stayed changed and every later pull failed (1405-07-25)
            fi
            sleep $(( 240 + RANDOM % 121 ))  # 4-6 minutes, so releases are not clock-aligned
          done
      - name: start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml -R "${{ github.repository }}"
