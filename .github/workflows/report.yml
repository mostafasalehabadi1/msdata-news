name: daily-report
# Started by release.yml from 18:30 Tehran on a trading day until the report exists. Writes it with the best-rated
# model that answers (tools/write_report.py) and publishes it in the same run - the report has top priority.
on:
  workflow_dispatch:
    inputs:
      now:
        description: write the latest day's report now, even outside 18:30 / trading days
        default: ""
  push:  # editing report-now.txt from the manager VPS = a manual "write it now"
    branches: [main]
    paths: [report-now.txt]
concurrency:
  group: daily-report
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: write and publish the daily report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          git config user.name msdata-news-bot
          git config user.email bot@msdata.ir
          python tools/write_report.py ${{ (inputs.now || github.event_name == 'push') && '--now' || '' }}
          git add queue data
          git diff --cached --quiet && exit 0
          git commit -qm "report: $(python -c 'import json;print(json.load(open("data/latest.json"))["date_fa"])')"
          python tools/release.py
          python tools/validate.py && git add news && git commit -qm "release: daily report" || git checkout -- news
          git pull -q --rebase && git push -q origin HEAD:main && git push -qf origin HEAD:refs/heads/published
