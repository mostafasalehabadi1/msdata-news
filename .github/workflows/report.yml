name: daily-report
# Started by release.yml from 18:30 Tehran on a trading day until the report exists. Writes it with the best-rated
# model that answers (tools/write_report.py) and publishes it in the same run - the report has top priority.
on:
  workflow_dispatch:
    inputs:
      now:
        description: write the latest day's report now, even outside 18:30 / trading days
        default: ""
      headline:
        description: optional fixed headline for the report
        default: ""
  push:  # editing report-now.txt from the manager VPS = a manual "write it now"
    branches: [main]
    paths: [report-now.txt]
concurrency:
  group: daily-report
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 110  # gemma alone may take 2x600s; 40 min killed every report of 1405-07-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: write and publish the daily report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          ARAD_API_KEY: ${{ secrets.ARAD_API_KEY }}
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          git config user.name msdata-news-bot
          git config user.email bot@msdata.ir
          HL="${{ inputs.headline }}"
          # 1405-07-27: every run since 10-18 hit the 110-minute job limit and was cancelled; each market gets 45 minutes
          timeout 2700 python -u tools/write_report.py ${{ (inputs.now || github.event_name == 'push') && '--now' || '' }} ${HL:+--headline "$HL"}
          # Kish export-market report: same rules and time (owner 1405-07-15)
          timeout 2700 python -u tools/write_report.py --market kish ${{ (inputs.now || github.event_name == 'push') && '--now' || '' }} || true
          # Iran Energy Exchange report, 4 parts (owner 1405-07-27): same rules and time
          timeout 2700 python -u tools/write_report.py --market energy ${{ (inputs.now || github.event_name == 'push') && '--now' || '' }} || true
          # 2026-10-12: this step used to commit data/ and news/ and then rebase; the release loop pushes the same files every few
          # minutes, so the rebase hit a conflict and the job failed (a written report would have been lost). Now only the new
          # report files are kept, the checkout is reset to the newest main, and release + push are retried up to 3 times.
          mkdir -p /tmp/rep/kish /tmp/rep/energy
          for f in $(git status --porcelain queue | grep 'report-' | awk '{print $2}'); do cp "$f" "/tmp/rep/${f#queue/}"; done
          git diff --no-color data/scenarios.jsonl | grep '^+{' | cut -c2- > /tmp/rep/scenarios.txt || true
          # content agent 1405-07-27: no report by 22:00 Tehran -> a line in news-test/report-missing.log (it then writes it by hand)
          if [ -z "$(find /tmp/rep -name 'report-*.json')" ]; then
            d=$(python -c 'import json;print(json.load(open("data/latest.json"))["date"])')
            if [ "$(TZ=Asia/Tehran date +%H%M)" -ge 2200 ] && [ ! -e "news/report-$d.json" -o ! -e "news/kish/report-$d.json" ]; then
              git fetch -q origin main && git reset -q --hard origin/main
              grep -q "^$d " news-test/report-missing.log 2>/dev/null || { echo "$d $(TZ=Asia/Tehran date '+%F %H:%M') no report from any model (physical: $([ -e news/report-$d.json ] && echo ok || echo missing), kish: $([ -e news/kish/report-$d.json ] && echo ok || echo missing))" >> news-test/report-missing.log
                git add news-test/report-missing.log && git commit -qm "report missing: $d" && git push -q origin HEAD:main || true; }
            fi
            exit 0
          fi
          for try in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main && git clean -qfd queue news
            # content agent 1405-07-21: a report it has put there meanwhile (queue or news) always wins and is never overwritten
            n=0
            for f in /tmp/rep/report-*.json; do b=$(basename "$f"); [ -e "$f" ] && [ ! -e "queue/$b" ] && [ ! -e "news/$b" ] && cp "$f" queue/ && n=$((n+1)); done
            for f in /tmp/rep/kish/report-*.json; do b=$(basename "$f"); [ -e "$f" ] && [ ! -e "queue/kish/$b" ] && [ ! -e "news/kish/$b" ] && mkdir -p queue/kish && cp "$f" queue/kish/ && n=$((n+1)); done
            [ "$n" -gt 0 ] || { echo "the report is already there (content agent); nothing to publish"; exit 0; }
            cat /tmp/rep/scenarios.txt >> data/scenarios.jsonl
            git add queue data/scenarios.jsonl
            git commit -qm "report: $(python -c 'import json;print(json.load(open("data/latest.json"))["date_fa"])')"
            python tools/release.py
            python tools/validate.py && git add news && git commit -qm "release: daily report" || git checkout -- news
            if git push -q origin HEAD:main; then git push -qf origin HEAD:refs/heads/published; exit 0; fi
            sleep 20
          done
          exit 1
