name: macro-news
# «اقتصاد کلان»: started hourly by release.yml; writes one news per new macro / open-market data point (tools/write_macro.py)
# and publishes it at once (news/macro/ on the published branch).
on:
  workflow_dispatch:
  push:  # editing macro-now.txt from the manager VPS = write the pending macro news now
    branches: [main]
    paths: [macro-now.txt]
concurrency:
  group: macro-news
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: write and publish macro news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          git config user.name msdata-news-bot
          git config user.email bot@msdata.ir
          python tools/write_macro.py
          git add data/macro_seen.json data/scenarios.jsonl news/macro 2>/dev/null || git add data/macro_seen.json
          git diff --cached --quiet && exit 0
          python tools/validate.py || { echo "validate failed"; exit 1; }
          git commit -qm "macro: news"
          git pull -q --rebase && git push -q origin HEAD:main && git push -qf origin HEAD:refs/heads/published
