name: write-free (pilot)
# Pilot: writes N symbol news with free models into news-test/ (not published).
# Run manually, or push a change to pilot.txt (its content = how many symbols).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "how many symbols"
        default: "10"
  push:
    branches: [main]
    paths: ["pilot.txt"]
concurrency:
  group: write-free
  cancel-in-progress: true
permissions:
  contents: write
  models: read
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: write news with free models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          PUSH_EACH: "1"
        run: |
          git config user.name msdata-news-bot
          git config user.email bot@msdata.ir
          LIMIT="${{ inputs.limit }}"
          [ -z "$LIMIT" ] && LIMIT="$(tr -dc 0-9 < pilot.txt)"
          if [ "${LIMIT:-0}" != "0" ]; then
            python tools/write_free.py --limit "$LIMIT" --out queue | tee pilot-log.txt
          else
            # 0 = backlog mode: packages of 2 until every traded symbol of the latest day has a news (max ~5h)
            end=$(( $(date +%s) + 330*60 ))
            while [ "$(date +%s)" -lt "$end" ]; do
              git pull -q --rebase || true
              out=$(python tools/write_free.py --limit 2 --out queue | tee -a pilot-log.txt | tail -1)
              case "$out" in *"/0;"*) break ;; esac          # nothing left to write
              case "$out" in "written 0/"*) sleep 900 ;; *) sleep 60 ;; esac  # all models busy -> wait 15 min
            done
          fi
      - name: commit pilot output
        run: |
          git config user.name msdata-news-bot
          git config user.email bot@msdata.ir
          mkdir -p news-test && mv pilot-log.txt news-test/
          git add queue news-test
          git diff --cached --quiet || git commit -m "pilot: free-model news"
          git pull --rebase -q && git push
