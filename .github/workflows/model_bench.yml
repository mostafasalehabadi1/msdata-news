name: model-bench
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/model_bench.py"]
concurrency:
  group: model-bench
  cancel-in-progress: true
permissions:
  contents: write
  models: read
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: every model writes the same news
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          USE_GITHUB_MODELS: "1"
        run: |
          python tools/model_bench.py
          git config user.name msdata-news-bot
          git config user.email bot@msdata.ir
          git add news-test/bench.json && git commit -qm "bench: persian writing" && git pull -q --rebase && git push -q
